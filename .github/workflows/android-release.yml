name: Android APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'plan/**'
      - '**.md'
  workflow_dispatch:

# 发布 Release 需要写权限；不要把该权限暴露给 pull_request 触发。
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 四个签名 secret 全部存在时才构建正式签名包；否则回退到调试 APK。
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK 与 cmdline-tools，不再使用
      # android-actions/setup-android（它会安装已被 SDK 仓库移除的 "tools" 包而失败）。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager，ANDROID_SDK_ROOT=$SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Read app version
        id: version
        run: |
          VERSION="$(./gradlew -q :app:printVersionName | tail -n 1 | tr -d '\r')"
          if [ -z "$VERSION" ]; then
            echo "无法读取 versionName" >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mebox-release.jks"
          test -s "$RUNNER_TEMP/mebox-release.jks"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          MEBOX_KEYSTORE_FILE: ${{ runner.temp }}/mebox-release.jks
          MEBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PmeboxVersionCode=${{ github.run_number }} --stacktrace

      - name: Build debug APK (signing secrets not configured)
        if: env.HAS_SIGNING_KEY != 'true'
        run: ./gradlew :app:assembleDebug -PmeboxVersionCode=${{ github.run_number }} --stacktrace

      - name: Collect APK and checksum
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          BUILD="${{ github.run_number }}"
          shopt -s nullglob
          APK_DIR="app/build/outputs/apk/release"
          KIND="release-signed"
          APKS=("$APK_DIR"/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            APK_DIR="app/build/outputs/apk/debug"
            KIND="debug"
            APKS=("$APK_DIR"/*.apk)
          fi
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "没有找到 APK 产物：$APK_DIR" >&2
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-unsigned}"
            abi="${abi%-release}"
            abi="${abi%-debug}"
            if [ -z "$abi" ]; then
              abi="universal"
            fi
            NAME="MeBox-Android-${VERSION}-build.${BUILD}-${KIND}-${abi}.apk"
            cp "$apk" "dist/${NAME}"
            (cd dist && sha256sum "$NAME" > "$NAME.sha256")
            echo "collected: ${NAME}"
          done
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "count=${#APKS[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mebox-android-build-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Compute release metadata
        id: meta
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="MeBox Android ${TAG}"
          else
            TAG="v${VERSION}-build.${{ github.run_number }}"
            TITLE="MeBox Android v${VERSION} (build ${{ github.run_number }})"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.sha256
          body: |
            ## MeBox Android 自动构建

            - 版本：`${{ steps.version.outputs.name }}`（versionCode `${{ github.run_number }}`）
            - 构建类型：`${{ steps.apk.outputs.kind }}`
            - 同一份 APK 同时支持手机与 Android TV（Leanback）；电视端可用手机扫码输入服务器、账号和搜索词
            - 提交：`${{ github.sha }}`
            - 分支/标签：`${{ github.ref_name }}`
            - 单元测试与 lint：已通过

            ### 安装

            APK 已按 CPU 架构拆分（`arm64-v8a`、`armeabi-v7a`、`x86`、`x86_64`），
            另外附带一个包含全部架构的 `universal` 包。电视盒子通常使用
            `arm64-v8a`；Android TV 模拟器使用 `x86_64`。

            ```bash
            adb install -r MeBox-Android-...-arm64-v8a.apk
            # 或直接使用 universal 包
            adb install -r MeBox-Android-...-universal.apk
            ```

            ### 说明

            - `release-signed` 使用仓库 Secrets 中的发布密钥签名，可用于覆盖升级。
            - `debug` 表示尚未配置签名 Secrets，使用调试签名，仅用于测试。
            - APK 旁边的 `.sha256` 文件可用于校验下载完整性。
            - 本工作流不运行真机/模拟器仪器测试，发布前仍需人工验证关键流程。
